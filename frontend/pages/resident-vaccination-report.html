<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Vaccination Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background: #20466c;
            color: white;
        }

        tr:nth-child(even) {
            background: #f3f6f9;
        }

        #message {
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Resident Vaccination Report</h1>

        <p class="description">
            Barangay Healthcare and Vaccination Management System
            <br>
            Residents and Vaccination Records (LEFT JOIN)
        </p>

        <p id="message">Loading records...</p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Resident ID</th>
                        <th>Resident Name</th>
                        <th>Record ID</th>
                        <th>Date Administered</th>
                        <th>Next Due Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        function formatDate(value) {
            if (!value) return '-';

            return new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Manila',
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            }).format(new Date(value));
        }

        async function loadReport() {
            const message = document.getElementById('message');
            const tableBody = document.getElementById('reportBody');

            try {
                const response = await fetch('/api/residents/report');

                if (!response.ok) {
                    throw new Error('Unable to load report');
                }

                const records = await response.json();

                if (!Array.isArray(records)) {
                    throw new Error('Invalid report data');
                }

                tableBody.replaceChildren();

                records.forEach(record => {
                    const row = document.createElement('tr');

                    const values = [
                        record.resident_id,
                        record.resident_name,
                        record.record_id ?? '-',
                        formatDate(record.date_administered),
                        formatDate(record.next_due_date),
                        record.next_dose_status ?? 'No record'
                    ];

                    values.forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    tableBody.appendChild(row);
                });

                message.textContent = records.length +
                    ' report row(s) found.';

            } catch (error) {
                message.textContent = 'Error loading report.';
                console.error(error);
            }
        }

        loadReport();
    </script>
</body>
</html>
